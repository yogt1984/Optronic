# Development conveniences for the reference SDK image; never for a product image.
TOOLCHAIN_HOST_TASK:append = " nativesdk-cmake nativesdk-ninja"
TOOLCHAIN_TARGET_TASK:append = " gstreamer1.0-dev gstreamer1.0-plugins-base-dev mosquitto-dev nlohmann-json-dev googletest-dev"
# x264enc (plugins-ugly) is patent-encumbered; Yocto gates it behind the
# "commercial" license flag. Acceptable for a reference/demo image.
LICENSE_FLAGS_ACCEPTED:append = " commercial"

# PetaLinux pins both caches under ${TOPDIR}, which a container build throws
# away on every retry. Point them at the mounted caches instead.
SSTATE_DIR = "/sstate"
DL_DIR = "/downloads"
